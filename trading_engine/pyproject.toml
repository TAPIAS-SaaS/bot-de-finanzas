[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-de-finanzas-engine"
version = "1.0.0"
description = "Motor cuantitativo autónomo en Python para investigación de estrategias, backtesting sin sesgo de anticipación, paper trading, TimesFM y gestión determinista de riesgo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Equipo de Ingeniería TAPIAS-SaaS" }
]
dependencies = [
  "numpy>=1.26.0,<3.0.0",
  "pandas>=2.1.0,<3.0.0",
  "pydantic>=2.5.0,<3.0.0",
  "fastapi>=0.109.0,<1.0.0",
  "uvicorn>=0.27.0,<1.0.0",
  "ccxt>=4.2.0,<5.0.0",
  "httpx>=0.26.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.3.0,<1.0.0",
]
timesfm = [
  # TimesFM 2.5 es opcional por consumo de memoria/CPU en equipos modestos.
  # No descargue automáticamente pesos de TimesFM 3.0 en producción sin verificar licencia.
  "timesfm>=1.1.0; python_version>='3.10'",
]

[project.scripts]
trading-bot = "trading_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
