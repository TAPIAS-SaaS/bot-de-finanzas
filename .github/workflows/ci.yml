name: CI — Bot de Finanzas (Python + Web + Seguridad)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  security-and-secrets-audit:
    name: Auditoría de Secretos y Archivos Prohibidos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar que no existan archivos .env reales, bases de datos SQLite ni claves privadas
        run: |
          set -e
          FORBIDDEN_FILES=$(git ls-files | grep -E '(^|/)\.env($|\.[^e])|\.sqlite3?$|\.db$|\.pem$|\.key$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR CRÍTICO: Archivos prohibidos o bases de datos detectados en el repositorio:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "Verificación de archivos sensibles superada."

  python-trading-engine:
    name: Motor Cuantitativo Python (Ruff + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading_engine
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trading_engine/requirements.txt

      - name: Instalar dependencias del motor cuantitativo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Ejecutar linter Ruff
        run: ruff check src tests

      - name: Ejecutar suite de pruebas Pytest (sin claves reales ni órdenes reales)
        env:
          TRADING_MODE: paper
          ALLOW_LIVE_TRADING: "false"
        run: PYTHONPATH=src pytest

  web-dashboard-and-server:
    name: Dashboard React + Servidor Node.js (Lint, Tests y Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 y Python 3.11
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias web
        run: npm ci

      - name: Comprobación estricta de tipos TypeScript
        run: npm run lint

      - name: Ejecutar pruebas unitarias y de integración (Node + Frontend + Puente Python)
        env:
          TRADING_MODE: paper
          ALLOW_LIVE_TRADING: "false"
        run: npm test

      - name: Compilar aplicación web de producción
        run: npm run build
